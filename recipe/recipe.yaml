schema_version: 1

context:
  name: pyexasol
  version: 3.0.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 4fedec37b9a05088184f208b842f1d5f3e525a3167b8c38a2f050be228fc15cb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }},<4.0.0
    - cryptography >=45.0.7
    - packaging >=24.1.0
    - websocket-client >=1.0.1,<=1.9.0
    - pydantic >=2.13.4,<3.0.0
    - exasol-telemetry-client >=0.2.1,<0.3.0
tests:
  - python:
      imports:
        - pyexasol
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Exasol python driver with extra features
  homepage: https://github.com/badoo/pyexasol

extra:
  recipe-maintainers:
    - dbast
    - morazow
    - xylar
